
services:
  db:
    image: postgres:17
    container_name: nix-garden-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nix_garden
      POSTGRES_USER: nix_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - nix_garden_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nix_admin -d nix_garden"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nix_garden_data:
